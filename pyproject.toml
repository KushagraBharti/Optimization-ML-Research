[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "coverage_planning"
version = "0.1.0"
description = "Exact and greedy algorithms for 1D drone-coverage planning"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Kushagra Bharti" }]
dependencies = ["pytest", "ruff", "black", "mypy>=1.8", "pygame>=2.5.0"]

[project.optional-dependencies]
dev = ["pytest", "ruff", "black", "mypy>=1.8", "pygame>=2.5.0"]

[tool.ruff]
line-length = 100
select = ["E","F","I","UP"]

# Tell setuptools how to find your package
[tool.setuptools.packages.find]
include = ["coverage_planning*"]