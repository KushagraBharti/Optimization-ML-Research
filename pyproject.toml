[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "coverline"
version = "0.1.0"
description = "Paper-faithful implementation of covering segments on a line with drones."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "matplotlib>=3.8,<4.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
]

[project.scripts]
coverline = "coverline.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
